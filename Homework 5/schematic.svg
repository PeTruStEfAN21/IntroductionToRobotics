<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" font-family="Consolas, monospace" font-size="14">
  <rect width="1000" height="740" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold">Homework 5 - Stop the Counter! (ESP32 + 74HC595 + 4-digit display + joystick)</text>

  <!-- ESP32 -->
  <rect x="40" y="60" width="200" height="610" rx="8" fill="#e8eef7" stroke="#223" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="18" font-weight="bold">ESP32 DevKit</text>
  <g font-weight="bold" text-anchor="end">
    <text x="230" y="135">3V3</text>
    <text x="230" y="165">GPIO34</text>
    <text x="230" y="195">GPIO35</text>
    <text x="230" y="225">GPIO32</text>
    <text x="230" y="255">GND</text>
    <text x="230" y="345">GPIO23</text>
    <text x="230" y="375">GPIO18</text>
    <text x="230" y="405">GPIO22</text>
    <text x="230" y="435">3V3</text>
    <text x="230" y="465">GND</text>
    <text x="230" y="595">GPIO25</text>
    <text x="230" y="615">GPIO26</text>
    <text x="230" y="635">GPIO27</text>
    <text x="230" y="655">GPIO33</text>
  </g>

  <!-- Joystick -->
  <rect x="420" y="100" width="180" height="180" rx="8" fill="#f3f0e6" stroke="#223" stroke-width="2"/>
  <text x="530" y="180" text-anchor="middle" font-size="18" font-weight="bold">Joystick</text>
  <text x="530" y="202" text-anchor="middle" fill="#555">powered</text>
  <text x="530" y="220" text-anchor="middle" fill="#555">from 3.3V</text>
  <g font-weight="bold">
    <text x="430" y="135">+5V</text>
    <text x="430" y="165">VRx</text>
    <text x="430" y="195">VRy</text>
    <text x="430" y="225">SW</text>
    <text x="430" y="255">GND</text>
  </g>
  <line x1="240" y1="130" x2="420" y2="130" stroke="#c00" stroke-width="2"/>
  <line x1="240" y1="160" x2="420" y2="160" stroke="#06c" stroke-width="2"/>
  <line x1="240" y1="190" x2="420" y2="190" stroke="#06c" stroke-width="2"/>
  <line x1="240" y1="220" x2="420" y2="220" stroke="#06c" stroke-width="2"/>
  <line x1="240" y1="250" x2="420" y2="250" stroke="#000" stroke-width="2"/>
  <text x="330" y="124" text-anchor="middle" fill="#c00">3.3V, not 5V</text>
  <text x="330" y="214" text-anchor="middle" fill="#06c">INPUT_PULLUP</text>

  <!-- 74HC595 -->
  <rect x="420" y="310" width="150" height="250" rx="6" fill="#ddd" stroke="#223" stroke-width="2"/>
  <text x="495" y="548" text-anchor="middle" font-size="16" font-weight="bold">74HC595</text>
  <g font-weight="bold">
    <text x="430" y="345">DS</text>
    <text x="430" y="375">SHCP</text>
    <text x="430" y="405">STCP</text>
    <text x="430" y="435">VCC+MR</text>
    <text x="430" y="465">GND+OE</text>
  </g>
  <g font-weight="bold" text-anchor="end">
    <text x="562" y="335">Q7</text>
    <text x="562" y="363">Q6</text>
    <text x="562" y="391">Q5</text>
    <text x="562" y="419">Q4</text>
    <text x="562" y="447">Q3</text>
    <text x="562" y="475">Q2</text>
    <text x="562" y="503">Q1</text>
    <text x="562" y="531">Q0</text>
  </g>
  <line x1="240" y1="340" x2="420" y2="340" stroke="#06c" stroke-width="2"/>
  <line x1="240" y1="370" x2="420" y2="370" stroke="#06c" stroke-width="2"/>
  <line x1="240" y1="400" x2="420" y2="400" stroke="#06c" stroke-width="2"/>
  <line x1="240" y1="430" x2="420" y2="430" stroke="#c00" stroke-width="2"/>
  <line x1="240" y1="460" x2="420" y2="460" stroke="#000" stroke-width="2"/>
  <text x="330" y="334" text-anchor="middle" fill="#06c">data</text>
  <text x="330" y="364" text-anchor="middle" fill="#06c">shift clock</text>
  <text x="330" y="394" text-anchor="middle" fill="#06c">latch</text>
  <text x="330" y="485" text-anchor="middle" fill="#555">100 nF between</text>
  <text x="330" y="502" text-anchor="middle" fill="#555">VCC and GND</text>

  <!-- Segment lines with 1k resistors -->
  <g stroke="#0a7" stroke-width="2">
    <line x1="570" y1="330" x2="760" y2="330"/>
    <line x1="570" y1="358" x2="760" y2="358"/>
    <line x1="570" y1="386" x2="760" y2="386"/>
    <line x1="570" y1="414" x2="760" y2="414"/>
    <line x1="570" y1="442" x2="760" y2="442"/>
    <line x1="570" y1="470" x2="760" y2="470"/>
    <line x1="570" y1="498" x2="760" y2="498"/>
    <line x1="570" y1="526" x2="760" y2="526"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="635" y="322" width="60" height="16"/>
    <rect x="635" y="350" width="60" height="16"/>
    <rect x="635" y="378" width="60" height="16"/>
    <rect x="635" y="406" width="60" height="16"/>
    <rect x="635" y="434" width="60" height="16"/>
    <rect x="635" y="462" width="60" height="16"/>
    <rect x="635" y="490" width="60" height="16"/>
    <rect x="635" y="518" width="60" height="16"/>
  </g>
  <text x="665" y="312" text-anchor="middle">8 x 1k</text>

  <!-- Display -->
  <rect x="760" y="310" width="200" height="250" rx="6" fill="#2a2a2a" stroke="#223" stroke-width="2"/>
  <text x="880" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4-digit</text>
  <text x="880" y="422" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">7-segment</text>
  <text x="880" y="446" text-anchor="middle" fill="#f66">common cathode</text>
  <g font-weight="bold" fill="#fff">
    <text x="770" y="335">A</text>
    <text x="770" y="363">B</text>
    <text x="770" y="391">C</text>
    <text x="770" y="419">D</text>
    <text x="770" y="447">E</text>
    <text x="770" y="475">F</text>
    <text x="770" y="503">G</text>
    <text x="770" y="531">DP</text>
  </g>
  <g font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="820" y="552">D1</text>
    <text x="860" y="552">D2</text>
    <text x="900" y="552">D3</text>
    <text x="940" y="552">D4</text>
  </g>

  <!-- Digit select lines -->
  <g stroke="#a3c" stroke-width="2" fill="none">
    <polyline points="240,590 820,590 820,560"/>
    <polyline points="240,610 860,610 860,560"/>
    <polyline points="240,630 900,630 900,560"/>
    <polyline points="240,650 940,650 940,560"/>
  </g>
  <text x="500" y="584" text-anchor="middle" fill="#a3c">digit select (active LOW)</text>

  <text x="500" y="705" text-anchor="middle" fill="#555">Bits are shifted LSB first: bit0 = A ends on Q7 ... bit7 = DP ends on Q0.</text>
  <text x="500" y="725" text-anchor="middle" fill="#555">All grounds are common. Everything is powered from 3.3V.</text>
</svg>
