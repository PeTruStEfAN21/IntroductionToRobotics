<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Consolas, monospace" font-size="14">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">Homework 4 - Smart Lamp Controller (ESP32)</text>

  <!-- ESP32 -->
  <rect x="60" y="70" width="200" height="330" rx="8" fill="#e8eef7" stroke="#223" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-size="18" font-weight="bold">ESP32 DevKit</text>
  <text x="160" y="120" text-anchor="middle" fill="#555">GPIO2 = Built-in LED</text>
  <text x="160" y="138" text-anchor="middle" fill="#555">(heartbeat)</text>
  <g font-weight="bold">
    <text x="250" y="185" text-anchor="end">GPIO18</text>
    <text x="250" y="285" text-anchor="end">GPIO21</text>
    <text x="250" y="375" text-anchor="end">GND</text>
  </g>

  <!-- GND rail -->
  <line x1="260" y1="370" x2="820" y2="370" stroke="#000" stroke-width="2"/>
  <line x1="820" y1="180" x2="820" y2="370" stroke="#000" stroke-width="2"/>
  <text x="815" y="392" text-anchor="end">GND rail</text>
  <circle cx="820" cy="280" r="4" fill="#000"/>
  <circle cx="820" cy="370" r="4" fill="#000"/>

  <!-- LED branch: GPIO18 -> 220R -> LED -> GND -->
  <line x1="260" y1="180" x2="400" y2="180" stroke="#06c" stroke-width="2"/>
  <rect x="400" y="168" width="100" height="24" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="450" y="214" text-anchor="middle">R 220-330 &#937;</text>
  <line x1="500" y1="180" x2="600" y2="180" stroke="#06c" stroke-width="2"/>
  <!-- LED symbol (anode left, cathode right) -->
  <polygon points="600,162 600,198 636,180" fill="#fdd" stroke="#000" stroke-width="2"/>
  <line x1="636" y1="162" x2="636" y2="198" stroke="#000" stroke-width="2"/>
  <line x1="628" y1="156" x2="642" y2="142" stroke="#c00" stroke-width="2"/>
  <line x1="640" y1="162" x2="654" y2="148" stroke="#c00" stroke-width="2"/>
  <text x="618" y="222" text-anchor="middle">LED</text>
  <text x="590" y="150" text-anchor="end" font-size="12">anode (+, long leg)</text>
  <text x="660" y="222" font-size="12">cathode (-)</text>
  <line x1="636" y1="180" x2="820" y2="180" stroke="#000" stroke-width="2"/>
  <text x="330" y="172" text-anchor="middle" font-size="12" fill="#06c">PWM</text>

  <!-- Button branch: GPIO21 -> button -> GND -->
  <line x1="260" y1="280" x2="520" y2="280" stroke="#080" stroke-width="2"/>
  <circle cx="524" cy="280" r="4" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="596" cy="280" r="4" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="520" y1="262" x2="600" y2="262" stroke="#000" stroke-width="2"/>
  <line x1="560" y1="262" x2="560" y2="246" stroke="#000" stroke-width="2"/>
  <line x1="548" y1="246" x2="572" y2="246" stroke="#000" stroke-width="2"/>
  <text x="560" y="310" text-anchor="middle">Push button (NO)</text>
  <line x1="600" y1="280" x2="820" y2="280" stroke="#000" stroke-width="2"/>
  <text x="390" y="270" text-anchor="middle" font-size="12" fill="#080">INPUT_PULLUP, FALLING IRQ</text>
  <text x="390" y="300" text-anchor="middle" font-size="12" fill="#555">idle = HIGH, pressed = LOW</text>

  <text x="450" y="440" text-anchor="middle" fill="#555" font-size="12">No external pull resistor: the ESP32 internal pull-up keeps GPIO21 HIGH until the button shorts it to GND.</text>
</svg>
